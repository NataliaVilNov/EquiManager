<style>

*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,sans-serif;color:var(--ink);padding-bottom:86px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit}.wrap{max-width:1180px;margin:0 auto;padding:20px 18px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brandMark{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:22px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--muted)}h1,h2,h3{margin:0;font-family:Fraunces,serif;letter-spacing:-.02em}h1{font-size:32px}h2{font-size:25px}h3{font-size:19px}.userbtn{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;box-shadow:var(--shadow);font-weight:700}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar.lg{width:48px;height:48px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.pad{padding:18px}.btn{border-radius:12px;padding:10px 15px;background:var(--soft);font-weight:800;font-size:13px}.btn.primary{background:var(--ink);color:var(--cream)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.red{background:var(--redBg);color:var(--red)}.grid{display:grid;gap:14px}.grid2{grid-template-columns:1.2fr .8fr}.grid3{grid-template-columns:repeat(3,1fr)}@media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr}.wrap{padding:14px 12px}h1{font-size:27px}.top{align-items:flex-start}.userbtn span.name{display:none}}

.viewHead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 14px}.viewHead p{margin:.25rem 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.bottomNav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bottomNav button{padding:8px 2px 9px;font-size:11px;font-weight:800;color:var(--muted)}.bottomNav .ico{display:block;font-size:22px;line-height:1.1}.bottomNav button.active{color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:20px;padding:15px;margin-bottom:12px}.legendGroup{min-width:240px;flex:1}.legendLabel{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-bottom:8px}.legendPills{display:flex;gap:7px;flex-wrap:wrap}.code{font-family:JetBrains Mono,monospace;font-size:11px;background:rgba(0,0,0,.07);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center}.weekbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.weekrange{margin-left:auto;color:var(--muted);font-weight:800;font-size:13px}.boardWrap{overflow:auto;border-radius:18px}.boardTable{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card);border:1px solid var(--line)}.boardTable th,.boardTable td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}.boardTable th:last-child,.boardTable td:last-child{border-right:0}.horseCol{width:165px;text-align:left!important;padding:13px!important;font-weight:800;background:var(--card);position:sticky;left:0;z-index:2}.boardTable thead .horseCol{z-index:4}.dayTh{padding:11px 5px!important;text-align:center}.daylabel{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:800}.daynum{font-family:Fraunces,serif;font-size:19px;font-weight:700;margin-left:3px}.dayTh.today{background:var(--today);color:#fff}.dayTh.today .daylabel,.dayTh.today .daynum{color:#fff}.dayTh.weekend,.cell.weekend{background:var(--weekend)}.cell{height:54px;text-align:center;vertical-align:middle;min-width:74px}.cell.today{background:var(--todayBg);box-shadow:inset 3px 0 var(--today),inset -3px 0 var(--today)}.cellBtn{width:100%;height:54px;display:grid;place-items:center}.empty{color:#c8c0aa;font-size:20px}.plan{display:flex;justify-content:center;gap:4px;align-items:center;flex-wrap:wrap}.planCode{font-family:JetBrains Mono,monospace;font-weight:800;border-radius:8px;padding:4px 7px;font-size:12px}.act-paddock{background:var(--blueBg);color:var(--blue)}.act-caminador{background:var(--greenBg);color:var(--green)}.act-cuerda{background:var(--pinkBg);color:var(--pink)}.act-monta{background:var(--grayBg);color:var(--gray)}.act-vet{background:#e3f2e7;color:#3f8f5f}.act-show{background:var(--orange);color:#fff}.done{text-decoration:line-through;color:#9d9583}.personNote{font-size:12px;color:var(--ink2);font-weight:700}.tableNote{margin-top:10px;color:var(--muted);font-size:13px}.ownerCards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}@media(max-width:850px){.ownerCards{grid-template-columns:1fr 1fr}.horseCol{width:130px}.boardWrap{margin:0 -12px;border-radius:0}.cell{min-width:72px}.weekrange{margin-left:0}}
/* classes */
.calendar{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow:auto}.dayCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:250px}.dayCard.today{outline:3px solid var(--today)}.classCard{margin-top:8px;border-radius:13px;padding:10px;background:var(--cream);border:1px solid var(--line);text-align:left}.classCard b{display:block}.classMeta{font-size:12px;color:var(--muted);font-weight:700}.studentRow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;font-size:13px}.studentRow:first-child{border-top:0}.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.rowMain{flex:1}.row b{display:block}.row small{color:var(--muted);font-weight:600}.modal{position:fixed;inset:0;background:rgba(31,58,46,.42);display:none;align-items:flex-end;z-index:40}.modal.show{display:flex}.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:680px;margin:0 auto;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 -18px 50px rgba(0,0,0,.18)}.form{display:grid;gap:11px}.f label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:550px){.inline{grid-template-columns:1fr}}

<script>
const LS='equilog.redisenio.carpetas.v1';
const today=new Date(); today.setHours(0,0,0,0); const iso=d=>d.toISOString().slice(0,10); const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x}; const mon=d=>{let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}; const week=()=>Array.from({length:7},(_,i)=>iso(add(mon(today),i))); const DAYS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM']; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){return {activeUser:'u_ale',activeView:'myStable',activeFolder:'priv_ale',activeWeek:iso(mon(today)),users:[{id:'u_manager',name:'Gerente',role:'Gerencia',color:'#1f3a2e',views:['manager'],photo:''},{id:'u_ale',name:'Ale',role:'Propietario y profesor',color:'#3f5f8f',views:['myHorses','myStable','teacher'],photo:''},{id:'u_prof',name:'Profesor/a',role:'Profesor/a escuela',color:'#b25a72',views:['teacher'],photo:''}],sites:[{id:'shl',name:'SHL',color:'#1f3a2e'},{id:'camp',name:'Campomanes',color:'#3f5f8f'}],folders:[{id:'site_shl',type:'site',name:'SHL',site:'shl',icon:'🏡',access:['u_manager','u_ale','u_prof']},{id:'school_shl',type:'school',name:'Escuela SHL',site:'shl',icon:'🎓',access:['u_manager','u_ale','u_prof']},{id:'stable_shl',type:'stable',name:'Cuadra SHL',site:'shl',icon:'🐴',access:['u_manager']},{id:'priv_ale',type:'private',name:'Cuadra privada de Ale',site:'shl',owner:'u_ale',icon:'🔒',access:['u_ale'],sharedWithManager:false},{id:'school_camp',type:'school',name:'Escuela Campomanes',site:'camp',icon:'🎓',access:['u_manager','u_ale','u_prof']}],horses:[
{id:'griotte',name:'Griotte',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'gogo',name:'Gogo',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'dassini',name:'Dassini',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'basilea',name:'Basilea',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'casado',name:'Casado',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'houston',name:'Houston',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'caleste',name:'Caleste',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},{id:'chacoon',name:'Chacoon',folder:'priv_ale',owners:['u_ale'],kind:'Privada'},
{id:'pony1',name:'Pony 1',folder:'school_shl',owners:[],kind:'Escuela'},{id:'pony2',name:'Pony 2',folder:'school_shl',owners:[],kind:'Escuela'},{id:'esc1',name:'Caballo escuela 1',folder:'school_camp',owners:[],kind:'Escuela'}],people:[{id:'p_n',name:'Natalia',code:'N',color:'#1f3a2e'},{id:'p_a',name:'Ale',code:'A',color:'#3f5f8f'},{id:'p_i',name:'Isa',code:'I',color:'#7a5ba0'},{id:'p_s',name:'Sonso',code:'S',color:'#a8721f'}],activities:[{id:'paddock',label:'Paddock',code:'P',cls:'act-paddock'},{id:'caminador',label:'Caminador',code:'C',cls:'act-caminador'},{id:'cuerda',label:'Cuerda',code:'CR',cls:'act-cuerda'},{id:'monta',label:'Monta',code:'M',cls:'act-monta'},{id:'vet',label:'Veterinario',code:'V',cls:'act-vet'},{id:'show',label:'Concurso',code:'★',cls:'act-show'}],plans:[
{horse:'caleste',date:week()[1],acts:[{activity:'monta',person:'p_a',done:true}]},{horse:'caleste',date:week()[3],acts:[{activity:'paddock',person:'p_a'}]},{horse:'chacoon',date:week()[2],acts:[{activity:'monta',person:'p_n',done:true},{activity:'monta',person:'p_a',done:true}]},{horse:'chacoon',date:week()[5],acts:[{activity:'show'}]},{horse:'dassini',date:week()[1],note:'Isa Montesa'},{horse:'dassini',date:week()[3],acts:[{activity:'paddock'}],note:'Javi Obama'},{horse:'houston',date:week()[2],acts:[{activity:'caminador',done:true}]},{horse:'gogo',date:week()[3],acts:[{activity:'monta',person:'p_n'}]},{horse:'basilea',date:week()[3],acts:[{activity:'cuerda',person:'p_s'},{activity:'paddock'}]}],students:[{id:'stu1',name:'Alumno/a 1',notes:'Le cuesta galopar a mano izquierda.',level:'Iniciación'},{id:'stu2',name:'Alumno/a 2',notes:'Pendiente recuperar clase.',level:'Ponis'},{id:'stu3',name:'Alumno/a 3',notes:'Salto básico.',level:'Intermedio'}],classes:[{id:'cl1',folder:'school_shl',date:week()[0],time:'17:00',type:'grupo',title:'Grupo ponis',teacher:'u_prof',students:[{student:'stu1',horse:'pony1'},{student:'stu2',horse:'pony2'}]},{id:'cl2',folder:'school_shl',date:week()[2],time:'18:00',type:'particular',title:'Particular iniciación',teacher:'u_ale',students:[{student:'stu3',horse:'pony1'}]},{id:'cl3',folder:'school_camp',date:week()[4],time:'17:30',type:'grupo',title:'Grupo Campomanes',teacher:'u_ale',students:[{student:'stu1',horse:'esc1'},{student:'stu3',horse:'esc1'}]}],expenses:[{horse:'caleste',concept:'Herrador',amount:120,paidBy:'u_ale'},{horse:'griotte',concept:'Veterinario',amount:85,paidBy:'u_ale'}]}}
let S=JSON.parse(localStorage.getItem(LS)||'null')||seed(); function save(){localStorage.setItem(LS,JSON.stringify(S))} const U=()=>S.users.find(u=>u.id===S.activeUser); const H=id=>S.horses.find(h=>h.id===id); const F=id=>S.folders.find(f=>f.id===id); const P=id=>S.people.find(p=>p.id===id); const A=id=>S.activities.find(a=>a.id===id); const Stu=id=>S.students.find(s=>s.id===id);
function hasAccess(folder){const u=U(); if(u.views.includes('manager'))return true; if(folder.type==='private'&&folder.owner===u.id)return true; return folder.access.includes(u.id)} function visibleFolders(){return S.folders.filter(f=>hasAccess(f)|| (U().views.includes('manager')&&f.type==='private'))} function visibleHorses(){const u=U(); if(S.activeView==='myHorses')return S.horses.filter(h=>h.owners.includes(u.id)); if(S.activeFolder)return S.horses.filter(h=>h.folder===S.activeFolder); return S.horses.filter(h=>hasAccess(F(h.folder)||{}))} function title(t){document.getElementById('title').textContent=t} function avatarHtml(u,cls=''){return u.photo?`<img class="avatar ${cls}" src="${u.photo}">`:`<span class="avatar ${cls}" style="background:${u.color}">${esc(u.name[0])}</span>`}
function render(){document.getElementById('userAvatar').outerHTML=avatarHtml(U());document.getElementById('userName').textContent=U().name;['home','folders','board','classes','more'].forEach(v=>document.getElementById('nav-'+v).classList.toggle('active',S.view===v)); const views={home:rHome,folders:rFolders,board:rBoard,classes:rClasses,more:rMore}; (views[S.view||'home']||rHome)(); hydrate(); save()}
function go(v){S.view=v; render()} function setView(v){S.activeView=v;if(v==='myStable')S.activeFolder='priv_ale'; if(v==='teacher')S.activeFolder='school_shl'; render()} function openFolder(id){S.activeFolder=id; const f=F(id); if(f.type==='school')S.view='classes'; else S.view='board'; render()}
function rHome(){title('Inicio'); const u=U(); const viewTabs=[['myHorses','Mis caballos'],['myStable','Mi cuadra privada'],['teacher','Mis clases'],['manager','Gerencia']].filter(([v])=>u.views.includes(v)); document.getElementById('app').innerHTML=`<div class="tabs">${viewTabs.map(([v,l])=>`<button class="tab ${S.activeView===v?'active':''}" onclick="setView('${v}')">${l}</button>`).join('')}</div><section class="hero"><div class="card heroMain"><div class="ey">Vista actual</div><h2>${esc(viewTabs.find(x=>x[0]===S.activeView)?.[1]||'Inicio')}</h2><p>${S.activeView==='myHorses'?'Tus caballos aunque estén en sedes o cuadras distintas.':S.activeView==='teacher'?'Tus clases, alumnos, grupos y asignación de ponis/caballos.':S.activeView==='manager'?'Sedes, escuelas, cuadras y accesos compartidos.':'Tu pizarra privada, gastos, salud y documentos.'}</p><div class="quick"><button onclick="go('folders')">📁<br>Carpetas<small>Sedes y cuadras</small></button><button onclick="go('board')">▦<br>Pizarra<small>Semana de caballos</small></button><button onclick="go('classes')">◷<br>Clases<small>Calendario escuela</small></button><button onclick="openQuick()">💬<br>Orden rápida<small>Tipo WhatsApp</small></button></div></div><div class="card pad"><h3>Hoy importa</h3><div class="statusList">${alerts().map(a=>`<div class="status"><span class="dot ${a.t}"></span><div><b>${a.b}</b><br><small>${a.s}</small></div></div>`).join('')}</div></div></section><section class="card pad"><h3>Accesos directos</h3><div class="folderGrid" style="margin-top:12px">${visibleFolders().slice(0,6).map(folderCard).join('')}</div></section>`}
function alerts(){return[{t:'',b:'Pizarra semanal lista',s:'Paddock, caminador, cuerda, monta, veterinario y concurso.'},{t:'warn',b:'2 clases esta semana',s:'Accede a clases para ver alumnos y asignar caballo/poni.'},{t:'bad',b:'Privacidad por carpeta',s:'El gerente solo ve cuadras privadas si se comparten.'}]}
function folderCard(f){const locked=U().views.includes('manager')&&f.type==='private'&&!f.sharedWithManager&&!f.access.includes(U().id);return `<button class="card folder ${locked?'locked':''}" onclick="${locked?'alert(\'Cuadra privada no compartida con gerencia\')':'openFolder(\''+f.id+'\')'}"><div class="folderIcon">${f.icon}</div><h3>${esc(f.name)}</h3><p>${locked?'Acceso no compartido':f.type==='school'?'Escuela: alumnos, profesores, clases y ponis.':f.type==='private'?'Cuadra privada: pizarra, caballos, gastos y salud.':'Sede del centro.'}</p><div class="chips"><span class="chip">${f.type}</span>${f.site?`<span class="chip">${esc(S.sites.find(s=>s.id===f.site)?.name||'')}</span>`:''}</div></button>`}
function rFolders(){title('Carpetas');document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>Sedes, escuelas y cuadras</h2><p>El centro se ordena por carpetas. Cada usuario accede solo a lo suyo.</p></div><button class="btn primary" onclick="editSites()">+ Sede / carpeta</button></div><div class="folderGrid">${visibleFolders().map(folderCard).join('')}</div>`}
function rBoard(){title('Pizarra'); const f=F(S.activeFolder)||F('priv_ale'); const horses=visibleHorses(); const dates=week(); document.getElementById('app').innerHTML=`<div class="viewHead"><div><div class="ey">${esc(f?.name||'Mis caballos')}</div><h2>Pizarra semanal</h2><p>Solo lo que se usa: paddock, caminador, cuerda, quién monta, veterinario, concurso y notas.</p></div><div class="actions"><button class="btn" onclick="repeatWeek()">↻ Repetir anterior</button><button class="btn primary" onclick="openPlan()">+ Registro</button></div></div>${boardLegend()}<div class="weekbar"><button class="btn ghost">← Anterior</button><button class="btn primary">◷ Hoy</button><button class="btn ghost">Siguiente →</button><span class="weekrange">${dates[0].slice(8,10)}–${dates[6].slice(8,10)}</span></div><div class="boardWrap"><table class="boardTable"><thead><tr><th class="horseCol">Caballo</th>${dates.map((d,i)=>`<th class="dayTh ${d===iso(today)?'today':''} ${i>4?'weekend':''}"><span class="daylabel">${DAYS[i]}</span><span class="daynum">${d.slice(8,10)}</span>${d===iso(today)?'<br><span class="pill gray">Hoy</span>':''}</th>`).join('')}</tr></thead><tbody>${horses.map(h=>`<tr><th class="horseCol">${esc(h.name)}<br><span class="chip">${esc(h.kind)}</span></th>${dates.map((d,i)=>cell(h.id,d,i)).join('')}</tr>`).join('')}</tbody></table></div><div class="tableNote">Toca una casilla para añadir o modificar actividades.</div>`}
function boardLegend(){return `<div class="legend card"><div class="legendGroup"><div class="legendLabel">Personas</div><div class="legendPills">${S.people.map(p=>`<span class="pill" style="background:${p.color}22;color:${p.color}"><span class="code">${p.code}</span>${esc(p.name)}</span>`).join('')}</div></div><div class="legendGroup"><div class="legendLabel">Actividades</div><div class="legendPills">${S.activities.map(a=>`<span class="pill ${a.cls.replace('act-','')}"><span class="code">${a.code}</span>${esc(a.label)}</span>`).join('')}</div></div></div>`}
function planFor(h,d){return S.plans.find(p=>p.horse===h&&p.date===d)} function cell(h,d,i){const p=planFor(h,d);let body='<span class="empty">·</span>'; if(p){if(p.acts?.length)body=`<div class="plan">${p.acts.map(x=>{const a=A(x.activity),pp=P(x.person);return `<span class="planCode ${a.cls} ${x.done?'done':''}">${x.done?'✓':''}${pp?pp.code:a.code}</span>`}).join('')}</div>`; if(p.note)body+=`<div class="personNote">${esc(p.note)}</div>`} return `<td class="cell ${d===iso(today)?'today':''} ${i>4?'weekend':''}"><button class="cellBtn" onclick="editCell('${h}','${d}')">${body}</button></td>`}
function rClasses(){title('Clases'); const folders=S.folders.filter(f=>f.type==='school'&&hasAccess(f)); const dates=week(); const cls=S.classes.filter(c=>folders.some(f=>f.id===c.folder)); document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>Calendario de clases</h2><p>En el calendario se ve hora, número de alumnos y profesor. Al entrar se asigna caballo/poni a cada niño.</p></div><button class="btn primary" onclick="openClass()">+ Clase</button></div><div class="tabs">${folders.map(f=>`<button class="tab ${S.activeFolder===f.id?'active':''}" onclick="S.activeFolder='${f.id}';render()">${esc(f.name)}</button>`).join('')}</div><div class="calendar">${dates.map((d,i)=>`<div class="dayCard ${d===iso(today)?'today':''}"><b>${DAYS[i]} ${d.slice(8,10)}</b>${cls.filter(c=>c.date===d&&(!S.activeFolder||c.folder===S.activeFolder)).map(classCard).join('')||'<p class="tableNote">Sin clases</p>'}</div>`).join('')}</div>`}
function classCard(c){return `<button class="classCard" onclick="openClassDetail('${c.id}')"><span class="pill ${c.type==='grupo'?'blue':'green'}">${c.type==='grupo'?'Grupo':'Particular'}</span><b>${c.time} · ${esc(c.title)}</b><div class="classMeta">${c.students.length} alumno${c.students.length>1?'s':''} · Profesor: ${esc(S.users.find(u=>u.id===c.teacher)?.name||'')}</div></button>`}
function rMore(){title('Más');document.getElementById('app').innerHTML=`<div class="grid grid2"><section class="card pad"><h2>Configuración</h2><div class="row"><div class="rowMain"><b>Perfiles personalizables</b><small>Foto, nombre, rol, color, vistas y accesos.</small></div><button class="btn" onclick="openProfile()">Editar</button></div><div class="row"><div class="rowMain"><b>Sedes personalizables</b><small>Crea SHL, Campomanes, finca, pista o cualquier carpeta.</small></div><button class="btn" onclick="editSites()">Editar</button></div><div class="row"><div class="rowMain"><b>Orden rápida</b><small>Preparado para WhatsApp más adelante.</small></div><button class="btn" onclick="openQuick()">Abrir</button></div></section><section class="card pad"><h2>Privacidad</h2><p class="tableNote">El gerente ve sedes y escuelas. Las cuadras privadas solo se ven si su dueño las comparte.</p><button class="btn primary" onclick="toggleShareAle()">${F('priv_ale').sharedWithManager?'Dejar de compartir cuadra de Ale':'Compartir cuadra de Ale con gerencia'}</button></section></div>`}
function hydrate(){document.querySelectorAll('.folder').forEach(()=>{});} function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')} function closeModal(){document.getElementById('modal').classList.remove('show')}
function openProfile(){const u=U();openModal(`<h2>Mi perfil</h2><div class="form"><div class="inline"><div class="f"><label>Nombre</label><input class="inp" id="pfName" value="${esc(u.name)}"></div><div class="f"><label>Rol</label><input class="inp" id="pfRole" value="${esc(u.role)}"></div></div><div class="f"><label>URL foto</label><input class="inp" id="pfPhoto" placeholder="https://..." value="${esc(u.photo||'')}"></div><div class="f"><label>Vistas activas</label><div class="legendPills">${['myHorses','myStable','teacher','manager'].map(v=>`<label class="pill gray"><input type="checkbox" value="${v}" ${u.views.includes(v)?'checked':''}> ${v}</label>`).join('')}</div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProfile()">Guardar</button></div></div>`)}
function saveProfile(){const u=U();u.name=pfName.value;u.role=pfRole.value;u.photo=pfPhoto.value;u.views=[...document.querySelectorAll('#sheet input[type=checkbox]:checked')].map(x=>x.value);if(!u.views.includes(S.activeView))S.activeView=u.views[0]||'myHorses';save();closeModal();render()}
function editSites(){openModal(`<h2>Sedes y carpetas</h2><div class="form"><div class="inline"><div class="f"><label>Nueva sede</label><input class="inp" id="siteName" placeholder="Nombre"></div><div class="f"><label>Color</label><input class="inp" id="siteColor" type="color" value="#1f3a2e"></div></div><button class="btn primary" onclick="addSite()">Añadir sede</button><div class="row"><div class="rowMain"><b>Sedes actuales</b><small>${S.sites.map(s=>esc(s.name)).join(', ')}</small></div></div></div>`)} function addSite(){if(!siteName.value.trim())return;const id='site_'+uid();S.sites.push({id,name:siteName.value.trim(),color:siteColor.value});S.folders.push({id:'fld_'+uid(),type:'site',name:siteName.value.trim(),site:id,icon:'🏡',access:[S.activeUser]});closeModal();render()}
function openQuick(){openModal(`<h2>Orden rápida</h2><p class="tableNote">De momento crea una nota pendiente. Después se conectará con WhatsApp.</p><textarea id="quickText" class="inp" rows="4" placeholder="Ej: mañana paddock para Caleste, monta Ale para Houston..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuick()">Guardar pendiente</button></div>`)} function saveQuick(){alert('Pendiente guardado: '+quickText.value);closeModal()}
function editCell(h,d){const p=planFor(h,d)||{horse:h,date:d,acts:[],note:''};openModal(`<h2>${esc(H(h).name)} · ${d}</h2><div class="form"><div class="f"><label>Actividad</label><select class="inp" id="cellAct"><option value="">Sin actividad</option>${S.activities.map(a=>`<option value="${a.id}">${a.label}</option>`).join('')}</select></div><div class="f"><label>Persona</label><select class="inp" id="cellPerson"><option value="">Sin persona</option>${S.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="f"><label>Nota</label><input class="inp" id="cellNote" value="${esc(p.note||'')}" placeholder="Ej: Javi Obama, Irene Montesa..."></div><label class="pill gray"><input type="checkbox" id="cellDone"> Marcar hecho</label><div class="actions"><button class="btn red" onclick="clearCell('${h}','${d}')">Limpiar</button><button class="btn primary" onclick="saveCell('${h}','${d}')">Guardar</button></div></div>`)} function saveCell(h,d){S.plans=S.plans.filter(p=>!(p.horse===h&&p.date===d)); const act=cellAct.value; const note=cellNote.value.trim(); if(act||note)S.plans.push({horse:h,date:d,acts:act?[{activity:act,person:cellPerson.value||null,done:cellDone.checked}]:[],note}); closeModal();render()} function clearCell(h,d){S.plans=S.plans.filter(p=>!(p.horse===h&&p.date===d));closeModal();render()} function openPlan(){editCell(visibleHorses()[0]?.id||'caleste',iso(today))} function repeatWeek(){alert('Preparado: copiará la semana anterior cuando tengamos datos reales.')}
function openClass(){openModal(`<h2>Nueva clase</h2><div class="form"><div class="inline"><div class="f"><label>Tipo</label><select class="inp"><option>Grupo</option><option>Particular</option></select></div><div class="f"><label>Hora</label><input class="inp" type="time"></div></div><div class="f"><label>Alumnos</label><input class="inp" placeholder="Seleccionar alumnos"></div><button class="btn primary" onclick="closeModal()">Guardar</button></div>`)} function openClassDetail(id){const c=S.classes.find(x=>x.id===id);openModal(`<h2>${esc(c.title)}</h2><p class="tableNote">${c.time} · ${c.type==='grupo'?'Clase en grupo':'Clase particular'} · ${esc(F(c.folder).name)}</p><div class="card pad" style="box-shadow:none;margin-top:10px">${c.students.map(x=>`<div class="studentRow"><span><b>${esc(Stu(x.student).name)}</b><small> · ${esc(Stu(x.student).level)}</small></span><select onchange="x=0" class="inp" style="max-width:190px">${S.horses.filter(h=>F(h.folder)?.type==='school'||h.folder===c.folder).map(h=>`<option ${h.id===x.horse?'selected':''}>${esc(h.name)}</option>`).join('')}</select></div>`).join('')}</div><div class="f" style="margin-top:12px"><label>Anotaciones de la clase</label><textarea class="inp" rows="3" placeholder="Observaciones, asistencia, recuperación..."></textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="closeModal()">Guardar</button></div>`)}
function toggleShareAle(){F('priv_ale').sharedWithManager=!F('priv_ale').sharedWithManager;if(F('priv_ale').sharedWithManager&&!F('priv_ale').access.includes('u_manager'))F('priv_ale').access.push('u_manager');if(!F('priv_ale').sharedWithManager)F('priv_ale').access=F('priv_ale').access.filter(x=>x!=='u_manager');render()} function reset(){localStorage.removeItem(LS);location.reload()}
S.view=S.view||'home'; render();
</script>
</body>
</html>
