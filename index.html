function currentShortcuts(){let u=U();u.shortcuts=u.shortcuts||{};if(!u.shortcuts[S.activeView])u.shortcuts[S.activeView]=(navByView[S.activeView]||[]).slice(1,5).map(x=>x[0]);return u.shortcuts[S.activeView]}
function r_home(){setTitle('Inicio');const u=U();const tabs=u.views.map(v=>`<button class="tab ${S.activeView===v?'active':''}" onclick="setView('${v}')">${viewsMeta[v].label}</button>`).join('');let sc=currentShortcuts();document.getElementById('app').innerHTML=`<div class="tabs">${tabs}</div><section class="hero"><div class="card heroMain"><div class="ey">Vista actual</div><h2>${viewsMeta[S.activeView].label}</h2><p>${viewsMeta[S.activeView].desc}</p><div class="quick">${sc.map(k=>shortcutButton(k)).join('')}</div><button class="btn ghost" style="margin-top:12px" onclick="editShortcuts()">Personalizar accesos directos</button></div><div class="card pad"><h3>Hoy importa</h3><div class="statusList">${alerts().map(a=>`<button class="status" onclick="${a.act}"><span class="dot ${a.t}"></span><span><b>${esc(a.b)}</b><small>${esc(a.s)}</small></span></button>`).join('')}</div></div></section>${homeExtra()}`}
function shortcutButton(k){const d=shortcutDefs[k]||['•',k,''];return `<button onclick="go('${k}')">${d[0]}<br>${d[1]}<small>${d[2]}</small></button>`}
function homeExtra(){if(S.activeView==='manager')return `<section class="card pad"><h3>Carpetas del centro</h3><div class="folderGrid" style="margin-top:12px">${folders().slice(0,6).map(folderCard).join('')}</div></section>`; if(S.activeView==='myStable')return `<section class="card pad"><h3>Tu cuadra privada</h3><div class="tileGrid" style="margin-top:12px">${['board','horses','quick','people'].map(tile).join('')}</div></section>`; if(S.activeView==='teacher')return `<section class="card pad"><h3>Escuela</h3><div class="tileGrid" style="margin-top:12px">${['classes','schoolHorses','charges','quick'].map(tile).join('')}</div></section>`; return `<section class="card pad"><h3>Mis caballos</h3><div class="tileGrid" style="margin-top:12px">${['ownerHorses','vet','expenses','reminders'].map(tile).join('')}</div></section>`}
function tile(k){const d=shortcutDefs[k]||['•',k,''];return `<button class="card tile" onclick="go('${k}')"><div class="tileIcon">${d[0]}</div><h3>${d[1]}</h3><p>${d[2]}</p></button>`}
function alerts(){let arr=[];if(S.activeView==='myStable'){arr.push({t:'',b:'Pizarra lista',s:'Paddock, caminador, cuerda, monta, veterinario y concurso.',act:"go('board')"},{t:'warn',b:'Houston con seguimiento',s:'Revisión veterinaria pendiente.',act:"go('vet')"})}if(S.activeView==='teacher'){let n=S.classes.filter(c=>c.teacher===U().id).length;arr.push({t:'',b:n+' clases visibles',s:'Pulsa para ver niños y asignar caballo o poni.',act:"go('classes')"},{t:'warn',b:'Cobros pendientes',s:'Clases de grupo pendientes de cobro.',act:"go('charges')"})}if(S.activeView==='myHorses'){arr.push({t:'warn',b:'2 gastos pendientes',s:'Herrador y veterinario.',act:"go('expenses')"},{t:'',b:'2 recordatorios',s:'Vacuna y revisión de tratamiento.',act:"go('reminders')"})}if(S.activeView==='manager'){arr.push({t:'',b:'Centro ordenado por carpetas',s:'Sedes, escuelas y cuadras privadas.',act:"go('folders')"},{t:'bad',b:'Privacidad de cuadras privadas',s:'El gerente no entra salvo que se comparta.',act:"go('folders')"})}return arr}
function folderCard(f){const locked=U().views.includes('manager')&&f.type==='private'&&!f.sharedWithManager&&!f.access.includes(U().id);return `<button class="card folder ${locked?'locked':''}" onclick="${locked?'alert(\'Cuadra privada no compartida con gerencia\')':'openFolder(\''+f.id+'\')'}"><div class="folderIcon">${f.icon}</div><h3>${esc(f.name)}</h3><p>${locked?'Acceso no compartido':f.type==='school'?'Escuela: alumnos, profesores, clases y caballos disponibles.':f.type==='private'?'Cuadra privada: pizarra, caballos, orden rápida y personal.':'Sede del centro.'}</p><div class="chips"><span class="chip">${esc(f.type)}</span>${f.site?`<span class="chip">${esc(S.sites.find(s=>s.id===f.site)?.name||'')}</span>`:''}</div></button>`}
function r_folders(){setTitle('Carpetas');document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>Sedes, escuelas y cuadras</h2><p>Carpetas para ordenar el centro. Cada usuario ve solo lo que toca.</p></div><button class="btn primary" onclick="editSites()">+ Sede / carpeta</button></div><div class="folderGrid">${folders().map(folderCard).join('')}</div>`}
function boardTitle(){if(S.activeView==='teacher')return 'Pizarra de escuela'; if(S.activeView==='myHorses')return 'Pizarra de mis caballos';return 'Pizarra semanal'}
function r_board(){setTitle('Pizarra');const f=F(S.activeFolder)||F('priv_ale'),horses=horseScope(),dates=week();document.getElementById('app').innerHTML=`<div class="viewHead"><div><div class="ey">${esc(S.activeView==='myHorses'?'Mis caballos':f?.name||'')}</div><h2>${boardTitle()}</h2><p>Solo lo útil: paddock, caminador, cuerda, quién monta, veterinario, concurso y notas.</p></div><div class="actions"><button class="btn" onclick="repeatWeek()">↻ Repetir anterior</button><button class="btn primary" onclick="openPlan()">+ Registro</button></div></div>${boardLegend()}${weekbar()}<div class="boardWrap"><table class="boardTable"><thead><tr><th class="horseCol">Caballo</th>${dates.map((d,i)=>`<th class="dayTh ${d===iso(today())?'today':''} ${i>4?'weekend':''}"><span class="daylabel">${DAYS[i]}</span><span class="daynum">${d.slice(8,10)}</span>${d===iso(today())?'<br><span class="pill gray">Hoy</span>':''}</th>`).join('')}</tr></thead><tbody>${horses.map(h=>`<tr><th class="horseCol">${esc(h.name)}<br><span class="chip">${esc(h.kind)}</span></th>${dates.map((d,i)=>cell(h.id,d,i)).join('')}</tr>`).join('')}</tbody></table></div><div class="tableNote">Toca una casilla para añadir o modificar actividades.</div>`}
function weekbar(){let dates=week();return `<div class="weekbar"><button class="btn ghost" onclick="moveWeek(-1)">← Anterior</button><button class="btn primary" onclick="S.activeWeek=iso(mon(today()));render()">◷ Hoy</button><button class="btn ghost" onclick="moveWeek(1)">Siguiente →</button><span class="weekrange">${dates[0].slice(8,10)}–${dates[6].slice(8,10)}</span></div>`} function moveWeek(n){S.activeWeek=iso(add(new Date(S.activeWeek),n*7));render()}
function boardLegend(){return `<div class="legend card"><div class="legendGroup"><div class="legendLabel">Personas</div><div class="legendPills">${S.people.map(p=>`<span class="pill" style="background:${p.color}22;color:${p.color}"><span class="code">${p.code}</span>${esc(p.name)}</span>`).join('')}</div></div><div class="legendGroup"><div class="legendLabel">Actividades</div><div class="legendPills">${S.activities.map(a=>`<span class="pill gray"><span class="code">${a.code}</span>${esc(a.label)}</span>`).join('')}</div></div></div>`}
function planFor(h,d){return S.plans.find(p=>p.horse===h&&p.date===d)} function cell(h,d,i){const p=planFor(h,d);let body='<span class="empty">·</span>';if(p){body='';if(p.acts?.length)body+=`<div class="plan">${p.acts.map(x=>{let a=A(x.activity),pp=P(x.person);return `<span class="planCode ${a.cls} ${x.done?'done':''}">${x.done?'✓':''}${pp?pp.code:a.code}</span>`}).join('')}</div>`;if(p.note)body+=`<div class="personNote">${esc(p.note)}</div>`}return `<td class="cell ${d===iso(today())?'today':''} ${i>4?'weekend':''}"><button class="cellBtn" onclick="editCell('${h}','${d}')">${body}</button></td>`}
function r_horses(){setTitle('Caballos');renderHorses(horseScope(),'Caballos de la cuadra')} function r_schoolHorses(){setTitle('Caballos disponibles');renderHorses(S.horses.filter(h=>F(h.folder)?.type==='school'),'Caballos y ponis de escuela')} function r_ownerHorses(){setTitle('Mis caballos');renderHorses(S.horses.filter(h=>h.owners.includes(U().id)),'Tus caballos aunque estén en varias cuadras')}
function renderHorses(list,subtitle){document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>${subtitle}</h2><p>Ficha rápida con pizarra, ubicación, gastos y salud.</p></div><button class="btn primary" onclick="openHorse()">+ Caballo</button></div><div class="horseCards">${list.map(h=>`<button class="card horseCard" onclick="openHorseDetail('${h.id}')"><h3>${esc(h.name)}</h3><p>${esc(h.kind)} · ${esc(F(h.folder)?.name||'')}</p><div class="chips"><span class="pill ${h.status==='suave'?'orange':'green'}">${h.status==='suave'?'Seguimiento':'Disponible'}</span><span class="chip">${esc(S.sites.find(s=>s.id===h.site)?.name||'')}</span></div></button>`).join('')}</div>`}
function r_classes(){setTitle('Clases');const schools=S.folders.filter(f=>f.type==='school'&&access(f)),dates=week();let cls=S.classes.filter(c=>schools.some(f=>f.id===c.folder));document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>Calendario de clases</h2><p>Hora, número de alumnos, tipo de clase y asignación de poni/caballo.</p></div><button class="btn primary" onclick="openClass()">+ Clase</button></div><div class="tabs">${schools.map(f=>`<button class="tab ${S.activeFolder===f.id?'active':''}" onclick="S.activeFolder='${f.id}';render()">${esc(f.name)}</button>`).join('')}</div><div class="calendar">${dates.map((d,i)=>`<div class="dayCard ${d===iso(today())?'today':''}"><b>${DAYS[i]} ${d.slice(8,10)}</b>${cls.filter(c=>c.date===d&&(!S.activeFolder||c.folder===S.activeFolder)).map(classCard).join('')||'<p class="tableNote">Sin clases</p>'}</div>`).join('')}</div>`}
function classCard(c){return `<button class="classCard" onclick="openClassDetail('${c.id}')"><span class="pill ${c.type==='grupo'?'blue':'green'}">${c.type==='grupo'?'Grupo':'Particular'}</span><b>${c.time} · ${esc(c.title)}</b><div class="classMeta">${c.students.length} alumno${c.students.length>1?'s':''} · Profesor: ${esc((S.users.find(u=>u.id===c.teacher)||{}).name||'')}</div></button>`}
function r_charges(){setTitle('Cobros');let cls=S.classes.filter(c=>c.teacher===U().id||U().views.includes('manager'));let pend=cls.filter(c=>!c.paid),paid=cls.filter(c=>c.paid);document.getElementById('app').innerHTML=`<div class="grid grid2"><section class="card pad"><h2>Cobros pendientes</h2>${pend.map(c=>`<div class="row"><div class="rowMain"><b>${esc(c.title)}</b><small>${c.date} · ${c.time} · ${c.students.length} alumnos</small></div><span class="metric">${c.charge}€</span><button class="btn primary" onclick="markClassPaid('${c.id}')">Cobrado</button></div>`).join('')||'<p class="tableNote">Nada pendiente.</p>'}</section><section class="card pad"><h2>Cobrado</h2>${paid.map(c=>`<div class="row"><div class="rowMain"><b>${esc(c.title)}</b><small>${c.date} · ${c.time}</small></div><span class="pill green">${c.charge}€</span></div>`).join('')}</section></div>`}
function r_vet(){setTitle('Veterinario');renderOwnerList('Veterinario y salud',S.reminders.filter(r=>H(r.horse)?.owners.includes(U().id)).map(r=>({title:r.text,sub:H(r.horse).name+' · '+r.date,btn:'Ver'})))}
function r_expenses(){setTitle('Gastos');let list=S.expenses.filter(e=>H(e.horse)?.owners.includes(U().id));document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>Gastos</h2><p>Gastos de tus caballos, estén en la cuadra que estén.</p></div><button class="btn primary" onclick="openExpense()">+ Gasto</button></div><div class="card pad">${list.map(e=>`<div class="row"><div class="rowMain"><b>${esc(e.concept)}</b><small>${esc(H(e.horse).name)} · ${e.date}</small></div><span class="metric">${e.amount}€</span><span class="pill ${e.paid?'green':'orange'}">${e.paid?'Pagado':'Pendiente'}</span></div>`).join('')}</div>`}
function r_reminders(){setTitle('Recordatorios');renderOwnerList('Recordatorios',S.reminders.filter(r=>H(r.horse)?.owners.includes(U().id)).map(r=>({title:r.text,sub:H(r.horse).name+' · '+r.date,btn:'Hecho'})))}
function renderOwnerList(title,list){document.getElementById('app').innerHTML=`<section class="card pad"><h2>${title}</h2>${list.map(x=>`<div class="row"><div class="rowMain"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div><button class="btn">${x.btn}</button></div>`).join('')||'<p class="tableNote">Sin avisos.</p>'}</section>`}
function r_people(){setTitle(S.activeView==='myStable'?'Personal':'Equipo');document.getElementById('app').innerHTML=`<div class="viewHead"><div><h2>${S.activeView==='myStable'?'Personal de mi cuadra':'Equipo'}</h2><p>Personas que pueden aparecer en la pizarra o gestionar accesos.</p></div><button class="btn primary" onclick="openPerson()">+ Persona</button></div><div class="grid grid3">${S.people.map(p=>`<div class="card pad"><span class="avatar lg" style="background:${p.color}">${p.code}</span><h3 style="margin-top:8px">${esc(p.name)}</h3><p class="tableNote">Código de pizarra: ${p.code}</p></div>`).join('')}</div>`}
function r_today(){setTitle('Hoy importa');document.getElementById('app').innerHTML=`<section class="card pad"><h2>Hoy importa</h2><div class="statusList" style="margin-top:12px">${alerts().map(a=>`<button class="status" onclick="${a.act}"><span class="dot ${a.t}"></span><span><b>${esc(a.b)}</b><small>${esc(a.s)}</small></span></button>`).join('')}</div></section>`}
function r_more(){setTitle('Más');document.getElementById('app').innerHTML=`<div class="grid grid2"><section class="card pad"><h2>Configuración</h2><div class="row"><div class="rowMain"><b>Perfil personalizable</b><small>Foto, nombre, rol y vistas.</small></div><button class="btn" onclick="openProfile()">Editar</button></div><div class="row"><div class="rowMain"><b>Accesos directos</b><small>Elige lo que quieres ver al entrar.</small></div><button class="btn" onclick="editShortcuts()">Editar</button></div><div class="row"><div class="rowMain"><b>Sedes personalizables</b><small>Crea o cambia las sedes.</small></div><button class="btn" onclick="editSites()">Editar</button></div><div class="row"><div class="rowMain"><b>Orden rápida</b><small>Preparado para WhatsApp más adelante.</small></div><button class="btn" onclick="openQuick()">Abrir</button></div></section><section class="card pad"><h2>Privacidad</h2><p class="tableNote">El gerente ve la estructura, pero solo entra en cuadras privadas si el dueño comparte acceso.</p><button class="btn primary" onclick="toggleShareAle()">${F('priv_ale').sharedWithManager?'Dejar de compartir cuadra de Ale':'Compartir cuadra de Ale con gerencia'}</button><button class="btn red" style="margin-left:8px" onclick="reset()">Reset demo</button></section></div>`}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')} function closeModal(){document.getElementById('modal').classList.remove('show')}
function openUserSwitch(){openModal(`<h2>Cambiar usuario</h2><div class="form">${S.users.map(u=>`<button class="row" onclick="setUser('${u.id}')">${avatar(u)}<span class="rowMain"><b>${esc(u.name)}</b><small>${esc(u.role)}</small></span>${u.id===S.activeUser?'<span class="pill green">Activo</span>':''}</button>`).join('')}</div>`)}
function openProfile(){let u=U();openModal(`<h2>Mi perfil</h2><div class="form"><div class="inline"><div class="f"><label>Nombre</label><input class="inp" id="pfName" value="${esc(u.name)}"></div><div class="f"><label>Rol</label><input class="inp" id="pfRole" value="${esc(u.role)}"></div></div><div class="inline"><div class="f"><label>Color</label><input class="inp" type="color" id="pfColor" value="${u.color}"></div><div class="f"><label>URL foto</label><input class="inp" id="pfPhoto" placeholder="https://..." value="${esc(u.photo||'')}"></div></div><div class="f"><label>Vistas posibles</label><div class="legendPills">${Object.entries(viewsMeta).map(([v,m])=>`<label class="pill gray"><input type="checkbox" value="${v}" ${u.views.includes(v)?'checked':''}> ${m.label}</label>`).join('')}</div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProfile()">Guardar</button></div></div>`)}
function saveProfile(){let u=U();u.name=pfName.value.trim()||u.name;u.role=pfRole.value.trim()||u.role;u.color=pfColor.value;u.photo=pfPhoto.value.trim();u.views=[...document.querySelectorAll('#sheet input[type=checkbox]:checked')].map(x=>x.value);if(!u.views.length)u.views=['myHorses'];if(!u.views.includes(S.activeView))S.activeView=u.views[0];closeModal();render()}
function editShortcuts(){let keys=Object.keys(shortcutDefs),active=new Set(currentShortcuts());openModal(`<h2>Accesos directos</h2><p class="tableNote">Elige qué tarjetas aparecen en Inicio para la vista: ${viewsMeta[S.activeView].label}.</p><div class="form">${keys.map(k=>`<label class="row"><input type="checkbox" value="${k}" ${active.has(k)?'checked':''}><span class="rowMain"><b>${shortcutDefs[k][1]}</b><small>${shortcutDefs[k][2]}</small></span></label>`).join('')}<button class="btn primary" onclick="saveShortcuts()">Guardar</button></div>`)}
function saveShortcuts(){let arr=[...document.querySelectorAll('#sheet input[type=checkbox]:checked')].map(x=>x.value).slice(0,6);let u=U();u.shortcuts=u.shortcuts||{};u.shortcuts[S.activeView]=arr.length?arr:['board','horses','quick'];closeModal();render()}
function editSites(){openModal(`<h2>Sedes</h2><div class="form"><div class="inline"><div class="f"><label>Nueva sede</label><input class="inp" id="siteName" placeholder="Nombre"></div><div class="f"><label>Color</label><input class="inp" id="siteColor" type="color" value="#1f3a2e"></div></div><button class="btn primary" onclick="addSite()">Añadir sede</button>${S.sites.map(s=>`<div class="row"><span class="avatar" style="background:${s.color}">${esc(s.name[0])}</span><span class="rowMain"><b>${esc(s.name)}</b><small>Sede personalizable</small></span></div>`).join('')}</div>`)} function addSite(){if(!siteName.value.trim())return;let id='site_'+uid();S.sites.push({id,name:siteName.value.trim(),color:siteColor.value});S.folders.push({id:'fld_'+uid(),type:'site',name:siteName.value.trim(),site:id,icon:'🏡',access:[S.activeUser]});closeModal();render()}
function openQuick(){openModal(`<h2>Orden rápida</h2><p class="tableNote">De momento queda como nota pendiente. Luego se conectará con WhatsApp.</p><textarea id="quickText" class="inp" rows="4" placeholder="Ej: mañana paddock para Caleste, monta Ale para Houston..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuick()">Guardar pendiente</button></div></div>`)} function saveQuick(){let t=quickText.value.trim();if(t)S.quickNotes.push({id:uid(),user:S.activeUser,view:S.activeView,text:t,date:iso(today())});closeModal();render()}
function editCell(h,d){let p=planFor(h,d)||{horse:h,date:d,acts:[],note:''};openModal(`<h2>${esc(H(h).name)} · ${d}</h2><div class="form"><div class="inline"><div class="f"><label>Actividad</label><select class="inp" id="cellAct"><option value="">Sin actividad</option>${S.activities.map(a=>`<option value="${a.id}">${a.label}</option>`).join('')}</select></div><div class="f"><label>Persona</label><select class="inp" id="cellPerson"><option value="">Sin persona</option>${S.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div></div><div class="f"><label>Nota</label><input class="inp" id="cellNote" value="${esc(p.note||'')}" placeholder="Ej: Javi Obama, Irene Montesa..."></div><label class="pill gray"><input type="checkbox" id="cellDone"> Marcar hecho</label><div class="actions"><button class="btn red" onclick="clearCell('${h}','${d}')">Limpiar</button><button class="btn primary" onclick="saveCell('${h}','${d}')">Guardar</button></div></div>`)} function saveCell(h,d){S.plans=S.plans.filter(p=>!(p.horse===h&&p.date===d));let act=cellAct.value,note=cellNote.value.trim();if(act||note)S.plans.push({horse:h,date:d,acts:act?[{activity:act,person:cellPerson.value||null,done:cellDone.checked}]:[],note});closeModal();render()} function clearCell(h,d){S.plans=S.plans.filter(p=>!(p.horse===h&&p.date===d));closeModal();render()} function openPlan(){let h=horseScope()[0];if(h)editCell(h.id,iso(today()))} function repeatWeek(){alert('Preparado: copiará la semana anterior cuando tengamos datos reales.')}
function openHorseDetail(id){let h=H(id);openModal(`<h2>${esc(h.name)}</h2><p class="tableNote">${esc(h.kind)} · ${esc(F(h.folder)?.name||'')} · ${esc(S.sites.find(s=>s.id===h.site)?.name||'')}</p><div class="tileGrid" style="margin-top:12px">${['board','vet','expenses','reminders'].map(tile).join('')}</div>`)} function openHorse(){alert('Alta de caballo: pendiente de conectar con formulario real.')}
function openClass(){openModal(`<h2>Nueva clase</h2><div class="form"><div class="inline"><div class="f"><label>Tipo</label><select class="inp" id="clType"><option value="grupo">Grupo</option><option value="particular">Particular</option></select></div><div class="f"><label>Hora</label><input class="inp" id="clTime" type="time" value="17:00"></div></div><div class="f"><label>Título</label><input class="inp" id="clTitle" placeholder="Grupo ponis, particular..."></div><button class="btn primary" onclick="saveClass()">Guardar</button></div>`)} function saveClass(){S.classes.push({id:'c_'+uid(),folder:S.activeFolder||'school_shl',date:iso(today()),time:clTime.value,type:clType.value,title:clTitle.value||'Clase',teacher:S.activeUser,students:[],charge:0,paid:false});closeModal();render()}
function openClassDetail(id){let c=S.classes.find(x=>x.id===id);openModal(`<h2>${esc(c.title)}</h2><p class="tableNote">${c.time} · ${c.type==='grupo'?'Clase en grupo':'Clase particular'} · ${esc(F(c.folder).name)}</p><div class="card pad" style="box-shadow:none;margin-top:10px">${c.students.map((x,i)=>`<div class="studentRow"><span><b>${esc(Stu(x.student).name)}</b><small> · ${esc(Stu(x.student).level)}</small></span><select onchange="setClassHorse('${c.id}',${i},this.value)" class="inp" style="max-width:190px">${S.horses.filter(h=>F(h.folder)?.type==='school').map(h=>`<option value="${h.id}" ${h.id===x.horse?'selected':''}>${esc(h.name)}</option>`).join('')}</select></div>`).join('')||'<p class="tableNote">Sin alumnos todavía.</p>'}</div><div class="f" style="margin-top:12px"><label>Anotaciones de la clase</label><textarea class="inp" rows="3" placeholder="Observaciones, asistencia, recuperación..."></textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="closeModal()">Guardar</button></div>`)} function setClassHorse(cid,i,hid){S.classes.find(c=>c.id===cid).students[i].horse=hid;save()}
function markClassPaid(id){let c=S.classes.find(c=>c.id===id);c.paid=true;render()} function openExpense(){alert('Nuevo gasto: siguiente paso.')} function openPerson(){alert('Nueva persona: siguiente paso.')}
function toggleShareAle(){let f=F('priv_ale');f.sharedWithManager=!f.sharedWithManager;if(f.sharedWithManager&&!f.access.includes('u_manager'))f.access.push('u_manager');if(!f.sharedWithManager)f.access=f.access.filter(x=>x!=='u_manager');render()} function reset(){localStorage.removeItem(LS);location.reload()}
render();
